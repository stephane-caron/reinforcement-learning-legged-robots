[workspace]
name = "reinforcement-learning-legged-robots"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Python < 3.14: the latexminted helper shipped with TeX Live (required by
# minted v3) is incompatible with the argparse changes of Python 3.14.
python = "<3.14"
pygments = "*"        # runtime dependency of latexminted
pylatexenc = "*"      # runtime dependency of latexminted
perl = "*"            # install-tl / tlmgr / TeX Live helper scripts
librsvg = "*"         # rsvg-convert: converts figures/*.svg to PDF
fontconfig = "*"
font-ttf-dejavu = "*" # generic sans/mono fallbacks for text in SVG figures
curl = "*"

[tasks.clean]
cmd = "rm -f reinforcement-learning-legged-robots.pdf && rm -rf output"
description = "Remove build artifacts"

[tasks.generate-figures]
cmd = "bash scripts/make-slides.sh --genfig-only"
description = "Convert figures/*.svg to figures/*.pdf"

[tasks.slides-make]
cmd = "bash scripts/make-slides.sh"
depends-on = ["texlive-install"]
description = "Build reinforcement-learning-legged-robots.pdf"

[tasks.slides-open]
cmd = "xdg-open reinforcement-learning-legged-robots.pdf"
depends-on = ["slides-make"]
description = "Open the slides in your PDF viewer"

[tasks.slides-watch]
cmd = "bash scripts/watch.sh"
depends-on = ["texlive-install"]
description = "Rebuild the slides whenever sources change"

[tasks.texlive-install]
cmd = "bash scripts/install-texlive.sh"
description = "Bootstrap the project-scoped TeX Live (one-time, ~250 MB, under ~/.local/share/texlive-projects/)"

[tasks.texlive-uninstall]
cmd = "bash scripts/uninstall-texlive.sh"
description = "Remove the project-scoped TeX Live installation"
